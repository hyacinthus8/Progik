<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauerolás Animáció (Molekuláris szint)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #e6e6fa; /* Világos lila háttér */
        }

        h1 {
            color: #4b0082; /* Sötét lila */
        }

        /* ------------------- A VIZUÁLIS MODELL ------------------- */
        .hair-strand {
            width: 400px;
            height: 200px;
            position: relative;
            border: 2px dashed #9370db; /* Keret a hajszál cortex reprezentálására */
            margin-top: 50px;
            margin-bottom: 50px;
        }

        /* Keratin láncok (A diszulfid-hidak által összekötött két fehérjelánc) */
        .keratin {
            width: 100%;
            height: 2px;
            background-color: #00008b; /* Sötétkék lánc */
            position: absolute;
            transition: transform 1.5s ease-in-out; /* Simább átmenet a mozgásnál */
        }
        
        .keratin-top {
            top: 30px;
        }

        .keratin-bottom {
            bottom: 30px;
        }

        /* Diszulfid-hidak (S-S) */
        .bridge {
            width: 5px;
            height: 60px; /* Híd hossza */
            background-color: transparent; /* Alapból átlátszó */
            border-left: 5px solid #ffaa00; /* Sárga hídvonal */
            position: absolute;
            top: 70px; /* Kezdő pozíció a két lánc között */
            transform-origin: top; /* A transform kezdőpontja felül legyen */
        }

        /* Híd szövege (S-S) */
        .bridge::after {
            content: 'S-S';
            position: absolute;
            top: 25px;
            left: 10px;
            color: #ffaa00;
            font-weight: bold;
        }

        .b1 { left: 50px; }
        .b2 { left: 195px; }
        .b3 { left: 340px; }

        /* ------------------- AZ ANIMÁCIÓ DEFINÍCIÓK ------------------- */

        /* 1. Redukció fázisa (Kötések feltörése és eltolódása) */
        .phase-reduction .keratin-top {
            transform: translateY(-20px); /* Felső lánc feljebb tolódik */
        }

        .phase-reduction .keratin-bottom {
            transform: translateY(20px); /* Alsó lánc lejjebb tolódik */
        }

        .phase-reduction .bridge {
            /* A hidak eltűnnek, és átveszi a helyét a tiolcsoport (JS-ben beállítva) */
            opacity: 0;
        }

        /* 2. Fixálás fázisa (Új kötések a hullámos/eltolódott pozícióban) */
        .phase-fixation .keratin-top {
            transform: translateY(-20px); 
        }

        .phase-fixation .keratin-bottom {
            transform: translateY(20px); 
        }

        .phase-fixation .bridge {
             /* Megtartjuk az eltolódást, és újra megjelennek a hidak */
            opacity: 1;
            transform: scaleY(1);
        }

        /* Animációs gomb stílusa */
        button {
            padding: 10px 20px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #startBtn { background-color: #3cb371; color: white; } /* Zöld */
        #startBtn:hover { background-color: #2e8b57; }

        #resetBtn { background-color: #dc143c; color: white; } /* Piros */
        #resetBtn:hover { background-color: #b22222; }

        .message {
            margin-top: 20px;
            font-size: 1.2em;
            color: #4b0082;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <h1>Kémiai Dauer: A Diszulfid-hidak Története</h1>

    <div id="statusMessage" class="message">Kattints a "Folyamat Indítása" gombra!</div>

    <div class="hair-strand" id="animationContainer">
        <div class="keratin keratin-top"></div>
        <div class="keratin keratin-bottom"></div>
        
        <div class="bridge b1"></div>
        <div class="bridge b2"></div>
        <div class="bridge b3"></div>
    </div>

    <div>
        <button id="startBtn" onclick="startPermAnimation()">▶️ Folyamat Indítása</button>
        <button id="resetBtn" onclick="resetAnimation()">🔄 Visszaállítás</button>
    </div>

    <script>
        const container = document.getElementById('animationContainer');
        const messageDisplay = document.getElementById('statusMessage');
        const bridges = document.querySelectorAll('.bridge');

        // Segédfüggvény a híd tartalmának frissítésére
        function updateBridgeContent(content) {
            bridges.forEach(bridge => {
                // Biztosítja, hogy a tiol (-SH) megjelenjen a feltört hidak helyén
                bridge.setAttribute('data-content', content);
                bridge.classList.toggle('tiol-content', content !== 'S-S');
            });
            // Hozzáadunk CSS szabályt, ami az animáció alatt módosítja a pseudo-elementet
            let style = document.getElementById('dynamicStyle');
            if (!style) {
                style = document.createElement('style');
                style.id = 'dynamicStyle';
                document.head.appendChild(style);
            }
            // Ha SH van, eltávolítjuk a sárga hídvonalat, és beállítjuk a szöveget
            if (content === 'SH') {
                style.textContent = `
                    .bridge { border-left: none !important; }
                    .bridge::after { content: 'SH'; top: 5px; color: #4b0082; left: 10px; }
                    .bridge.tiol-content { opacity: 1 !important; }
                `;
            } else {
                // Alapértelmezett S-S állapot
                 style.textContent = `
                    .bridge { border-left: 5px solid #ffaa00; }
                    .bridge::after { content: 'S-S'; top: 25px; color: #ffaa00; left: 10px; }
                    .bridge.tiol-content { opacity: 1; }
                `;
            }
        }

        // 1. lépés: Eredeti állapot (reset)
        function resetAnimation() {
            container.classList.remove('phase-reduction', 'phase-fixation');
            messageDisplay.textContent = "Kattints a \"Folyamat Indítása\" gombra!";
            updateBridgeContent('S-S');
        }

        // 2. lépés: Animáció indítása
        function startPermAnimation() {
            resetAnimation();
            messageDisplay.textContent = "1. FÁZIS: REDUKCIÓ (Dauerfolyadék). Feltörnek az S-S hidak.";

            // 1. Redukció: Feltörés
            setTimeout(() => {
                container.classList.add('phase-reduction');
                updateBridgeContent('SH'); 
            }, 500); // Fél másodperc múlva indul a redukciós fázis

            // 2. Fixálás: Újraépítés
            setTimeout(() => {
                messageDisplay.textContent = "2. FÁZIS: FIXÁLÁS (Neutralizálás). Az új formában újraépülnek az S-S hidak.";
                
                // Mivel a láncok már elmozdultak, a fixálás csak a hidakat építi újra
                container.classList.remove('phase-reduction');
                container.classList.add('phase-fixation');
                updateBridgeContent('S-S'); // Visszaállítjuk az S-S feliratot

            }, 3000); // 3 másodperc múlva indul a fixálás

            // 3. Befejezés
            setTimeout(() => {
                messageDisplay.textContent = "KÉSZ! A haj tartósan felvette az új, hullámos formát (Diszulfid-hidak stabilizáltak az új pozícióban).";
            }, 5500); // 5.5 másodperc múlva a teljes animáció véget ér
        }

        // Kezdeti állapot beállítása betöltéskor
        window.onload = resetAnimation;
    </script>

</body>
</html>
