<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dauerolás Animáció - Mozgó Vonalak</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
        }

        h1 {
            color: #007bff;
            margin-bottom: 30px;
        }

        .animation-container {
            width: 900px;
            height: 300px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            text-align: center;
            position: relative;
        }

        /* ------------------- HAJSZÁL STÍLUSOK (Keratin Vonalak) ------------------- */
        .hair-model {
            position: relative;
            width: 100px; 
            height: 180px;
            margin-bottom: 15px;
        }

        .keratin-line {
            position: absolute;
            background-color: #000;
            width: 100%;
            height: 2px;
            /* MOZGÁS BEÁLLÍTÁSA */
            transition: all 1s ease-in-out, opacity 0.3s; 
            transform-origin: 50% 50%; /* A forgatás középpontja */
        }

        .keratin-line-top {
            top: 50px;
        }

        .keratin-line-bottom {
            bottom: 50px;
        }
        
        /* ------------------- KÖTÉS STÍLUSOK ------------------- */
        .bond-container {
            position: absolute;
            top: 50px;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .bond {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 1s ease-in-out;
            color: #d4ac00;
        }

        .bond span {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            transition: all 1s;
            border: 1px solid;
        }
        
        /* --- KÖZÖS STÍLUSOK (S-S és SH) --- */
        .bond-ss span { 
            content: 'S-S'; 
            background-color: #ffeb3b; 
            color: #d4ac00;
            border-color: #d4ac00;
        }
        .bond-sh span { 
            content: 'SH';
            background-color: #aed6f1; 
            color: #21618c;
            border-color: #21618c;
        }

        /* ------------------- LÉPÉS SPECIFIKUS STÍLUSOK (EZ FELEL A MOZGÁSÉRT) ------------------- */

        /* 1. Lépés: Hullámos, S-S */
        #step1 .keratin-line {
            /* Hullámos hatás: Forgatjuk és középen összébb húzzuk, plusz enyhe ív a border-radius-szal */
            transform: rotate(-10deg) scaleY(0.9);
            border-radius: 5px / 30px; 
        }

        /* 2. Lépés: Egyenesedik, SH */
        #step2 .keratin-line {
            transform: none; /* Egyenes vonal */
            border-radius: 0;
        }

        /* 3. Lépés: Hullámosodik (csavarón), SH */
        #step3 .keratin-line {
            transform: rotate(-10deg) scaleY(0.9);
            border-radius: 5px / 30px;
        }

        /* 4. Lépés: Hullámos, új S-S */
        #step4 .keratin-line {
            transform: rotate(-10deg) scaleY(0.9); 
            border-radius: 5px / 30px;
        }
        
        /* ------------------- ANIMÁCIÓK / LÉPTETÉS ------------------- */

        /* Alapértelmezett, inaktív állapot: Elhalványítva */
        .animated .step:not(.active) .keratin-line,
        .animated .step:not(.active) .bond span {
            opacity: 0.3;
        }

        /* Aktív lépés kiemelése (az 'active' osztály bekapcsolja az áttűnést a formák között) */
        .animated .step.active .keratin-line,
        .animated .step.active .bond span {
            opacity: 1 !important;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
        }

        .step-label {
            font-weight: bold;
            margin-top: 10px;
            color: #444;
            min-height: 40px;
        }

        /* Vezérlők (CSS-t és JS-t már nem ismétlem, az a korábbi részből jön) */
        .controls { margin-top: 30px; }
        button {
            padding: 12px 25px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #prevBtn, #nextBtn { background-color: #007bff; color: white; }
        #resetBtn { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <h1>Dauerolás Kémiai Folyamata</h1>

    <div class="animation-container" id="animationContainer">
        
        <div class="step" id="step1">
            <div class="hair-model">
                <div class="keratin-line keratin-line-top"></div>
                <div class="keratin-line keratin-line-bottom"></div>
                <div class="bond-container">
                    <div class="bond bond-ss"><span>S-S</span></div>
                    <div class="bond bond-ss"><span>S-S</span></div>
                    <div class="bond bond-ss"><span>S-S</span></div>
                </div>
            </div>
            <div class="step-label">1. Eredeti állapot<br>**HULLÁMOS** (S-S kötések)</div>
        </div>

        <div class="step" id="step2">
            <div class="hair-model">
                <div class="keratin-line keratin-line-top"></div>
                <div class="keratin-line keratin-line-bottom"></div>
                <div class="bond-container">
                    <div class="bond bond-sh"><span>SH</span></div>
                    <div class="bond bond-sh"><span>SH</span></div>
                    <div class="bond bond-sh"><span>SH</span></div>
                </div>
            </div>
            <div class="step-label">2. Redukció<br>**KIEGYENESEDÉS** (S-S → SH)</div>
        </div>

        <div class="step" id="step3">
            <div class="hair-model">
                <div class="keratin-line keratin-line-top"></div>
                <div class="keratin-line keratin-line-bottom"></div>
                <div class="bond-container">
                    <div class="bond bond-sh"><span>SH</span></div>
                    <div class="bond bond-sh"><span>SH</span></div>
                    <div class="bond bond-sh"><span>SH</span></div>
                </div>
            </div>
            <div class="step-label">3. Csavarózás<br>**HULLÁMOS** forma (SH csoportok)</div>
        </div>

        <div class="step" id="step4">
            <div class="hair-model">
                <div class="keratin-line keratin-line-top"></div>
                <div class="keratin-line keratin-line-bottom"></div>
                <div class="bond-container">
                    <div class="bond bond-ss"><span>S-S</span></div>
                    <div class="bond bond-ss"><span>S-S</span></div>
                    <div class="bond bond-ss"><span>S-S</span></div>
                </div>
            </div>
            <div class="step-label">4. Fixálás<br>**HULLÁMOS** (Új S-S kötések)</div>
        </div>

    </div>

    <div class="controls">
        <button id="prevBtn" onclick="prevStep()">⬅️ Előző Lépés</button>
        <button id="nextBtn" onclick="nextStep()">Következő Lépés ➡️</button>
        <button id="resetBtn" onclick="resetAnimation()">🔄 Visszaállítás</button>
    </div>

    <script>
        const steps = document.querySelectorAll('.step');
        let currentStepIndex = 0;

        function showStep(index) {
            steps.forEach((step, i) => {
                // Csak az aktív lépést állítjuk 'active'-ra
                if (i === index) {
                    step.classList.add('active');
                } else {
                    step.classList.remove('active');
                }
            });
        }

        function nextStep() {
            if (currentStepIndex < steps.length - 1) {
                currentStepIndex++;
                showStep(currentStepIndex);
            }
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                showStep(currentStepIndex);
            }
        }

        function resetAnimation() {
            currentStepIndex = 0;
            showStep(currentStepIndex);
        }

        window.onload = () => {
            resetAnimation(); 
            document.getElementById('animationContainer').classList.add('animated'); 
        };
    </script>

</body>
</html>
