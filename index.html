<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diákcsoport Kezelő</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            color: #007bff;
            border-bottom: 2px solid #ccc;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        .shuffle-btn { background-color: #28a745; color: white; }
        .group-btn { background-color: #ffc107; color: #333; }
        .pick-btn { background-color: #dc3545; color: white; }

        button:hover {
            opacity: 0.9;
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #007bff;
            border-radius: 5px;
            background-color: #e9f7ff;
            min-height: 50px;
            white-space: pre-wrap; /* Megőrzi a sor formátumokat */
        }
        .group-input-container {
            margin-bottom: 15px;
        }
        .group-input-container input {
            padding: 8px;
            width: 60px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Diákcsoport Kezelő</h1>

    <p>Írd be a diákok neveit, minden nevet **új sorba** (Enterrel elválasztva):</p>
    <textarea id="studentNames" placeholder="Például:
Péter
Anna
Gábor
Orsolya
..."></textarea>

    <div class="group-input-container">
        <label for="groupSize">Csoportok mérete (tanulók száma/csoport):</label>
        <input type="number" id="groupSize" value="3" min="1">
    </div>

    <div>
        <button class="shuffle-btn" onclick="shuffleStudents()">🔀 Random Sorrend</button>
        <button class="group-btn" onclick="groupStudents()">👥 Random Csoportok</button>
        <button class="pick-btn" onclick="pickRandomStudent()">⭐ Tanuló Kisorsolása</button>
    </div>

    <hr>

    <h2>Eredmény:</h2>
    <div id="results">Kezd a műveleteket!</div>

    <script>
        // Segédfüggvény a tömb véletlenszerű összekeveréséhez (Fisher-Yates algoritmus)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 1. Diákok random sorrendbe rakása
        function shuffleStudents() {
            const namesText = document.getElementById('studentNames').value.trim();
            if (!namesText) {
                document.getElementById('results').innerHTML = "Kérlek, írj be neveket!";
                return;
            }

            // Nevek kinyerése és szűrjük ki az üres sorokat
            let names = namesText.split('\n').map(name => name.trim()).filter(name => name.length > 0);

            // Nevek véletlenszerű sorrendbe rendezése
            const shuffledNames = shuffleArray(names);

            document.getElementById('results').innerHTML = `<h3>🔀 Véletlenszerű Sorrend:</h3>${shuffledNames.join('\n')}`;
        }

        // 2. Diákok random csoportokba rendezése
        function groupStudents() {
            const namesText = document.getElementById('studentNames').value.trim();
            const size = parseInt(document.getElementById('groupSize').value);

            if (!namesText) {
                document.getElementById('results').innerHTML = "Kérlek, írj be neveket!";
                return;
            }
            if (isNaN(size) || size < 1) {
                document.getElementById('results').innerHTML = "Kérlek, adj meg egy érvényes csoportméretet (legalább 1)!";
                return;
            }

            let names = namesText.split('\n').map(name => name.trim()).filter(name => name.length > 0);
            if (names.length === 0) {
                 document.getElementById('results').innerHTML = "Kérlek, írj be neveket!";
                 return;
            }

            // Összekeverés
            let shuffledNames = shuffleArray(names);

            let groups = [];
            let groupNum = 1;

            // Csoportok létrehozása
            for (let i = 0; i < shuffledNames.length; i += size) {
                const group = shuffledNames.slice(i, i + size);
                groups.push(`**Csoport ${groupNum++}** (${group.length} fő):\n- ${group.join('\n- ')}`);
            }

            document.getElementById('results').innerHTML = `<h3>👥 Véletlenszerű Csoportok (méret: ${size}):</h3>${groups.join('\n\n')}`;
        }

        // 3. Egy tanuló kisorsolása
        function pickRandomStudent() {
            const namesText = document.getElementById('studentNames').value.trim();
            if (!namesText) {
                document.getElementById('results').innerHTML = "Kérlek, írj be neveket!";
                return;
            }

            let names = namesText.split('\n').map(name => name.trim()).filter(name => name.length > 0);
            if (names.length === 0) {
                 document.getElementById('results').innerHTML = "Kérlek, írj be neveket!";
                 return;
            }

            // Véletlenszerű index kiválasztása
            const randomIndex = Math.floor(Math.random() * names.length);
            const pickedStudent = names[randomIndex];

            document.getElementById('results').innerHTML = `<h3>⭐ Kisorsolt Tanuló:</h3><p style="font-size: 1.5em; color: #dc3545;">**${pickedStudent}**</p>`;
        }

        // Egy példa névlista a könnyebb teszteléshez
        window.onload = function() {
            document.getElementById('studentNames').value = "Péter\nAnna\nGábor\nOrsolya\nTamás\nRéka\nZoltán\nVirág\nLászló\nFanni";
        }
    </script>

</body>
</html>
